[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "football-attack-analysis"
version = "0.1.0"
description = "Research baseline for evaluating football attacking sequences"
requires-python = ">=3.10"
dependencies = ["numpy"]

[project.optional-dependencies]
video = ["opencv-python", "imageio-ffmpeg>=0.5"]
vision = ["opencv-python", "ultralytics", "imageio-ffmpeg>=0.5"]
soccernet = ["SoccerNet>=0.1.62"]
footpass = ["h5py>=3.10"]
ml = ["joblib>=1.3", "pandas>=2.0", "scikit-learn>=1.4"]
llm = ["openai>=1.0", "python-dotenv>=1.0"]
demo = [
  "streamlit>=1.40",
  "pandas>=2.0",
  "h5py>=3.10",
  "mplsoccer>=1.8,<2",
  "openai>=1.0",
  "python-dotenv>=1.0",
  "imageio-ffmpeg>=0.5",
]
research = [
  "h5py>=3.10",
  "joblib>=1.3",
  "mplsoccer>=1.8,<2",
  "openai>=1.0",
  "pandas>=2.0",
  "python-dotenv>=1.0",
  "scikit-learn>=1.4",
  "streamlit>=1.40",
  "imageio-ffmpeg>=0.5",
]

[project.scripts]
attack-analysis = "attack_analysis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
